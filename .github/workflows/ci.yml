name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    env:
      # There is no .env on the runner, so the config defaults apply and both
      # discovery_enabled and scheduler_enabled default to true. Seeding then
      # starts background discovery and the scheduler, which reach out to the
      # network and make this step flaky. Turn them off explicitly. This is why
      # the same commands pass in the postgres job, which sets these.
      ENVIRONMENT: local
      DISCOVERY_ENABLED: "false"
      SCHEDULER_ENABLED: "false"
      CACHE_ENABLED: "false"
      RATE_LIMIT_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check migrations match the models
        # Fails if someone edits app/models without generating a migration.
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: |
          alembic upgrade head
          alembic check

      - name: Run tests
        # Deliberately NOT ci.db. conftest drops every table when the session
        # ends, so sharing the migrated database with pytest would destroy the
        # schema the following step seeds into. A separate file keeps pytest
        # usable against any database while leaving ci.db intact.
        env:
          DATABASE_URL: sqlite:///./pytest.db
        run: pytest -q

      - name: Import the catalogue (no network)
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: |
          python -m app.db.seed --no-sources
          python -m app.cli providers import

  postgres:
    name: Backend migrations on PostgreSQL
    # SQLite is not the production database. A migration chain can pass every
    # SQLite test and still fail on Postgres, and vice versa, so the deploy
    # path is validated against a real Postgres matching docker-compose.yml.
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zexrdealhub
          POSTGRES_PASSWORD: zexrdealhub
          POSTGRES_DB: zexrdealhub_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+psycopg://zexrdealhub:zexrdealhub@localhost:5432/zexrdealhub_ci
      ENVIRONMENT: local
      DISCOVERY_ENABLED: "false"
      SCHEDULER_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            if python -c "import psycopg; psycopg.connect('${{ env.DATABASE_URL }}'.replace('postgresql+psycopg','postgresql')).close()" 2>/dev/null; then
              echo "PostgreSQL is accepting connections"; exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL never became reachable"; exit 1

      - name: Upgrade a fresh database
        # This is the step that a SQLite-only workflow cannot exercise.
        run: alembic upgrade head

      - name: Check migrations match the models
        run: alembic check

      - name: Import the catalogue through the ORM
        # Exercises real INSERTs through psycopg, not just the migration DDL.
        run: |
          python -m app.db.seed --no-sources
          python -m app.cli providers import

      - name: Confirm the database is populated and readable
        run: |
          python - <<'PY'
          from sqlalchemy import func, select
          from app.db.session import SessionLocal
          from app.models import Category, Offer, Source

          with SessionLocal() as session:
              offers = session.scalar(select(func.count()).select_from(Offer))
              sources = session.scalar(select(func.count()).select_from(Source))
              categories = session.scalar(select(func.count()).select_from(Category))
              print(f"offers={offers} sources={sources} categories={categories}")
              assert offers and sources and categories, "catalogue came back empty"
              assert session.scalar(select(Offer.official_url).limit(1)), "no offer rows readable"
          print("PostgreSQL round-trip OK")
          PY

      - name: Confirm no demo data was published
        run: |
          python - <<'PY'
          from sqlalchemy import select
          from app.db.session import SessionLocal
          from app.models import Offer

          with SessionLocal() as session:
              demo = session.scalars(
                  select(Offer).where(Offer.is_demo_data.is_(True))
              ).all()
              assert not demo, f"{len(demo)} demo offers present"
          print("no demo offers")
          PY

      - name: Create an isolated database for the test suite
        # conftest drops every table when the session ends, so the suite gets its
        # own database rather than the one the checks above just asserted against.
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect(
              "postgresql://zexrdealhub:zexrdealhub@localhost:5432/postgres",
              autocommit=True,
          ) as conn:
              conn.execute("DROP DATABASE IF EXISTS zexrdealhub_test")
              conn.execute("CREATE DATABASE zexrdealhub_test")
          print("test database ready")
          PY

      - name: Run the test suite against PostgreSQL
        # SQLite stores JSON as text, which hides dialect bugs. Running the same
        # suite on Postgres is what catches queries that only work on one engine.
        env:
          DATABASE_URL: postgresql+psycopg://zexrdealhub:zexrdealhub@localhost:5432/zexrdealhub_test
        run: pytest -q

  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        # The API is not running here; every fetch degrades to a fallback.
        env:
          API_BASE_URL: http://127.0.0.1:9
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: npm run build